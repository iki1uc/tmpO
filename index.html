  --surface: #f4f4f0;
  --surface-raised: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #3d3d3d;
  --ink-faint: #8a8a8a;
  --line: #0a0a0a;
  --line-soft: #d8d8d2;
  --accent: #e63312;
  --accent-ink: #ffffff;
  --raw-gray: #9a9a9a;
  --console-bg: #0a0a0a;
  --console-ink: #e8e8e2;
  --console-dim: #7d7d74;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #101010;
    --surface-raised: #1a1a1a;
    --ink: #f2f2ec;
    --ink-soft: #c9c9c0;
    --ink-faint: #7d7d74;
    --line: #f2f2ec;
    --line-soft: #33332e;
    --accent: #ff4a26;
    --accent-ink: #101010;
    --raw-gray: #6f6f68;
    --console-bg: #000000;
    --console-ink: #e8e8e2;
    --console-dim: #6f6f68;
  }
}
html {
  background: var(--surface);
}
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
::-moz-selection {
  background: var(--accent);
  color: var(--accent-ink);
}
::selection {
  background: var(--accent);
  color: var(--accent-ink);
}
textarea:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.hover\:border-\[var\(--line\)\]:hover {
  border-color: var(--line);
}
.hover\:bg-\[var\(--ink\)\]:hover {
  background-color: var(--ink);
}
.hover\:text-\[var\(--surface\)\]:hover {
  color: var(--surface);
}
@media (min-width: 640px) {
  .sm\:h-\[340px\] {
    height: 340px;
  }
  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-\[9px\] {
    font-size: 9px;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[1fr_340px\] {
    grid-template-columns: 1fr 340px;
  }
}
