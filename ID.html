<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>O · Orbit / Offenheit / Ursprung</title>
</head>

<body>

<h1>O – Orbit / Offenheit / Ursprung</h1>

<pre id="o-id"></pre>
<button id="spawn">Orbit‑Instanz erzeugen</button>
<pre id="o-instanz"></pre>

<script type="module">
  import { instanz } from "./instanz.js";

  const O_ID = {
    CORE: "O",
    VERSION: "1.0",
    AXIS: "O‑Axis",
    EBENE: "VR‑O",
    FREQUENZ: "2222 Hz",
    GEOMETRIE: "Orbit‑Ring",
    STATUS: "Aktiv"
  };

  document.getElementById("o-id").textContent =
    JSON.stringify(O_ID, null, 2);

  document.getElementById("spawn").addEventListener("click", () => {
    const i = instanz(O_ID, { ID: "O‑CORE" });
    document.getElementById("o-instanz").textContent =
      JSON.stringify(i, null, 2);
  });
</script>

</body>
</html>
